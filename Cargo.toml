[package]
name = "steamjaquettes"
version = "1.0.2"
edition = "2021"
description = "Images des jeux non-Steam (couverture, arrière-plan, logo, icône) depuis SteamGridDB"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
